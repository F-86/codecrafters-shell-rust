[package]
name = "codecrafters-shell"
version = "0.1.0"
authors = ["Codecrafters <hello@codecrafters.io>"]
edition = "2024"
rust-version = "1.95"

[dependencies]
# 唯一运行时依赖：rustyline 提供 readline + 历史栈 + TAB 补全 trait 框架。
# 其它历史依赖（anyhow / thiserror / bytes）在重构中确认零引用后已清理；
# 选型理由详见 docs/DESIGN_DECISIONS.md#deps-choice。
rustyline = "14"
